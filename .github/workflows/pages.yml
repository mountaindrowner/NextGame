name: pages
# Builds the static game and publishes it to GitHub Pages so it's playable
# from a URL. NOTE: on a free plan, enabling Pages on a PRIVATE repo makes the
# published site public. Nothing deploys until Pages is enabled in repo
# Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [claude/make-this-happen-o0q20w, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
