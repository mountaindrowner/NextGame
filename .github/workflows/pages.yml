name: pages
# Builds the static game and publishes it to GitHub Pages so it's playable
# from a URL.
#
# DISABLED on push (2026-06-15): this errored on every push because Pages isn't
# enabled, spamming failure emails. To turn it back on:
#   1. Repo Settings → Pages → Source: "GitHub Actions".
#   2. Re-add the `push:` trigger below (and run it once via "Run workflow").
# Until then it only runs manually (workflow_dispatch) so it can't fail in the
# background.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Enable Pages first: repo Settings → Pages → Source: "GitHub Actions".
      # The Actions token here can't auto-enable it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
