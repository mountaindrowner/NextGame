<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1824">
<title>Bonfire Bash</title>
<style>
:root{--shell:#d8d3df;--shell2:#c6bfd0;--bezel:#55546b;--bezel2:#45445a;--ink:#2a2a6a;--ab:#b0306c;--ab2:#7d1e4c;--hl:#d24a8a;--sh:#5a1236}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a1824;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#gb{position:relative;margin:0 auto;height:100vh;height:100dvh;max-width:460px;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 30% 0%,#e6e1ec 0%,var(--shell) 45%,var(--shell2) 100%);
  border-radius:16px 16px 64px 16px;box-shadow:inset 0 0 0 2px #ece8f1,inset -6px -8px 18px rgba(0,0,0,.18);
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);font-family:"Trebuchet MS",Verdana,sans-serif}
#topline{display:flex;justify-content:space-between;align-items:center;color:#9e97ab;font-size:9px;letter-spacing:1px;margin:0 2px 8px;font-weight:bold}
#topline span:nth-child(2){flex:1;height:2px;margin:0 8px;background:#c3bccd;border-bottom:1px solid #eee}
#bezel{background:linear-gradient(180deg,var(--bezel),var(--bezel2));border-radius:10px 10px 38px 10px;padding:7px 10px 16px;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
#stripe{display:flex;align-items:center;gap:6px;color:#b9b6cc;font-size:8px;letter-spacing:.6px;margin-bottom:7px;white-space:nowrap}
#stripe i{flex:1;height:5px;border-top:2px solid #8b2d6b;border-bottom:2px solid #2d3a8b}
#scrwrap{display:flex;align-items:center;gap:10px}
#ledbox{display:flex;align-items:center;gap:4px;color:#a9a6bb;font-size:7px;letter-spacing:.5px;flex:none}
#led{width:9px;height:9px;border-radius:50%;background:#3b1414;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
#led.on{background:#ff3a3a;box-shadow:0 0 8px #ff3030,inset 0 -1px 2px rgba(0,0,0,.4)}
#screen{display:block;margin:0 auto;width:min(calc(100vw - 58px), calc((50dvh - 80px) * 4 / 3), 400px);aspect-ratio:4/3;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border-radius:2px;box-shadow:0 0 0 2px #2c2b3a}
#brand{margin:8px 4px 0;color:var(--ink);font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.5px;line-height:1}
#brand #ver{float:right;font-size:11px;font-style:normal;font-weight:900;letter-spacing:1px;color:#8b2d6b;margin-top:8px}
#brand small{font-size:10px;font-style:normal;letter-spacing:2px;color:#8b2d6b;margin-left:6px;vertical-align:4px}
#controls{flex:1;position:relative;min-height:220px}
.btn{position:absolute;touch-action:none}
#dpad{left:4%;top:20%;width:clamp(116px,34vw,152px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c4bdcd 55%,#b6aec1 70%,transparent 71%)}
#dpad .h,#dpad .v{position:absolute;background:linear-gradient(180deg,#3a3946,#24232d);border-radius:5px;box-shadow:0 3px 0 #151419,inset 0 1px 0 #555}
#dpad .h{left:8%;right:8%;top:35%;bottom:35%}
#dpad .v{top:8%;bottom:8%;left:35%;right:35%}
#dpad .c{position:absolute;left:43%;top:43%;width:14%;height:14%;border-radius:50%;background:radial-gradient(circle,#1d1c24,#2e2d38)}
#dpad .arr{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.45}
#dpad .au{left:calc(50% - 6px);top:13%;border-bottom-color:#9a96a8}
#dpad .ad{left:calc(50% - 6px);bottom:13%;border-top-color:#9a96a8}
#dpad .al{top:calc(50% - 6px);left:13%;border-right-color:#9a96a8}
#dpad .ar{top:calc(50% - 6px);right:13%;border-left-color:#9a96a8}
#dpad.u .v{transform:perspective(200px) rotateX(10deg)} #dpad.d .v{transform:perspective(200px) rotateX(-10deg)}
#dpad.l .h{transform:perspective(200px) rotateY(-10deg)} #dpad.r .h{transform:perspective(200px) rotateY(10deg)}
#abwrap{right:3%;top:4%;width:clamp(144px,41vw,174px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#c9c2d2 55%,#bdb5c8 70%,transparent 71%)}
/* one colour per button, matched by the combo charts: A red, B green, SP gold, FOCUS/JUMP blue */
#bA{--ab:#c8303a;--ab2:#7a141c;--hl:#ee6a6a;--sh:#4e0c12} #bB{--ab:#2a9a4e;--ab2:#14602c;--hl:#5ad07a;--sh:#0c3a1a}
.ab{position:absolute;width:clamp(46px,13.2vw,56px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--hl),var(--ab) 55%,var(--ab2));box-shadow:0 4px 0 var(--sh),0 6px 8px rgba(0,0,0,.25)}
.ab.on{transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.ab b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:900;font-style:italic;text-shadow:0 1px 0 var(--sh)}
.ab i{position:absolute;left:-10px;right:-10px;bottom:-14px;text-align:center;color:var(--ink);font-size:8px;font-weight:900;font-style:normal;letter-spacing:.5px}
#bA{right:0;top:calc(50% - clamp(23px,6.6vw,28px))} #bB{left:0;top:calc(50% - clamp(23px,6.6vw,28px))}
#bSp{left:calc(50% - clamp(23px,6.6vw,28px));top:0;background:radial-gradient(circle at 40% 35%,#f0c24a,#c8901a 60%,#8a5a0a);box-shadow:0 4px 0 #5a3a06,0 6px 8px rgba(0,0,0,.25)}
#bSp.on{box-shadow:0 1px 0 #5a3a06} #bSp b{color:#3a2404;text-shadow:none;font-size:14px}
#bJ{left:calc(50% - clamp(23px,6.6vw,28px));bottom:0;background:radial-gradient(circle at 40% 35%,#6ab4ff,#2a6ad0 60%,#163a80);box-shadow:0 4px 0 #0e2450,0 6px 8px rgba(0,0,0,.25)}
#bJ.on{box-shadow:0 1px 0 #0e2450} #bJ b{color:#e0f0ff;text-shadow:0 1px 0 #0e2450;font-size:11px}
.pill{position:absolute;bottom:20%;width:54px;height:30px;transform:rotate(-25deg);display:flex;flex-direction:column;align-items:center}
.pill i{display:block;width:44px;height:11px;border-radius:8px;background:linear-gradient(180deg,#8f8a9c,#6e697d);box-shadow:0 2px 0 #4f4b5a,inset 0 1px 0 #aaa}
.pill.on i{transform:translateY(2px);box-shadow:none}
.pill span{margin-top:5px;color:var(--ink);font-size:9px;font-weight:900;letter-spacing:1px}
#bSel{left:calc(50% - 64px)} #bSta{left:calc(50% + 4px)}
#bA:active,#bB:active{filter:brightness(.95)}
#hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#8f88a0;font-size:9px;letter-spacing:.5px}
#speaker{position:absolute;right:6%;bottom:10%;display:flex;gap:7px;transform:rotate(-28deg)}
#speaker i{display:block;width:6px;height:46px;border-radius:4px;background:#a79fb3;box-shadow:inset 1px 2px 2px rgba(0,0,0,.35)}
/* the stick: in fights it shows its zones (up jumps, the far edges dash, back blocks) and a knob that follows the thumb */
#dpad .knob{position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff8a8a,#d02020 55%,#7a0e0e);box-shadow:0 3px 6px rgba(0,0,0,.4);opacity:0;transition:opacity .15s;pointer-events:none}
#dpad.mode-fight .knob{opacity:.92}
#dpad .zone{position:absolute;font-style:normal;font-size:7px;font-weight:900;letter-spacing:.5px;color:#6b6680;opacity:0;pointer-events:none}
#dpad.mode-fight .zone{opacity:1}
#dpad .zj{left:0;right:0;top:-11px;text-align:center}
#dpad .zl{left:-18px;top:calc(50% - 4px)} #dpad .zr{right:-18px;top:calc(50% - 4px)}
#dpad .zb{left:-6px;bottom:-9px;color:#a04a4a}
#dpad.dash .zl,#dpad.dash .zr{color:#d0a020}
@media (max-height:640px){#controls{min-height:190px}#dpad{top:10%}#abwrap{top:2%}}
/* WIDE: a GBA-style landscape shell. The 3:2 screen sits in the middle, the D-pad on the left, the buttons on the right,
   SELECT and START in the lower corners. On for a phone or tablet held sideways, or ?layout=wide. */
html.land #gb{max-width:none;width:100%;flex-direction:row;align-items:center;justify-content:center;border-radius:28px;
  padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left));
  background:radial-gradient(90% 120% at 50% 0%,#e6e1ec 0%,var(--shell) 45%,var(--shell2) 100%)}
html.land #topline,html.land #speaker,html.land #hint{display:none}
html.land #bezel{padding:5px 10px 9px;border-radius:12px 12px 30px 12px;z-index:1}
html.land #stripe{margin-bottom:4px;font-size:7px}
html.land #screen{width:min(calc((100dvh - 48px) * 3 / 2),calc(100vw - 2 * clamp(150px,25vw,230px)));aspect-ratio:3/2}
html.land #brand{position:absolute;left:max(18px,env(safe-area-inset-left));top:10px;margin:0;font-size:15px}
html.land #brand #ver{display:none}
html.land #controls{position:absolute;inset:0;min-height:0;pointer-events:none}
html.land #controls .btn{pointer-events:auto}
html.land #dpad{left:max(30px,calc(env(safe-area-inset-left) + 14px));top:50%;width:min(38dvh,150px);transform:translateY(-42%)}
html.land #abwrap{right:max(10px,env(safe-area-inset-right));top:50%;width:min(44dvh,172px);transform:translateY(-48%)}
html.land .pill{bottom:5%} html.land #bSel{left:max(22px,env(safe-area-inset-left))} html.land #bSta{left:auto;right:max(22px,env(safe-area-inset-right))}
html.land #gb::before,html.land #gb::after{content:"";position:absolute;top:0;width:22%;height:14px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,#b8b0c4,#a49cb2);box-shadow:inset 0 2px 0 #d8d2e0}
html.land #gb::before{left:4%} html.land #gb::after{right:4%}
</style>
</head>
<body>
<div id="gb">
  <div id="topline"><span>◀ OFF</span><span></span><span>ON ▶</span></div>
  <div id="bezel">
    <div id="stripe"><div id="ledbox"><div id="led"></div>POWER</div><i></i><span>PIXEL FIGHT SYSTEM</span><i></i></div>
    <div id="scrwrap">
      <canvas id="screen" width="256" height="192"></canvas>
    </div>
  </div>
  <div id="brand">DOJO BOY<small>ADVANCED</small><span id="ver"></span></div>
  <div id="controls">
    <div id="dpad" class="btn"><div class="h"></div><div class="v"></div><div class="c"></div><i class="arr au"></i><i class="arr ad"></i><i class="arr al"></i><i class="arr ar"></i><i class="zone zj">JUMP</i><i class="zone zl">DASH</i><i class="zone zr">DASH</i><i class="zone zb">BLOCK</i><i class="knob"></i></div>
    <div id="abwrap" class="btn"><div id="bSp" class="ab"><b>SP</b><i>SPECIAL</i></div><div id="bB" class="ab"><b>B</b><i>KICK</i></div><div id="bA" class="ab"><b>A</b><i>PUNCH</i></div><div id="bJ" class="ab"><b>JUMP</b></div></div>
    <div id="bSel" class="pill btn"><i></i><span>SELECT</span></div>
    <div id="bSta" class="pill btn"><i></i><span>START</span></div>
    <div id="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</div>
<script>
/*ASSETS*/
</script>
<script>
/*GAME*/
</script>
</body>
</html>
