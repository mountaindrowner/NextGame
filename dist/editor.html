<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OHMFRONT — Level Editor</title>
    <style>
      :root { --bg: #141017; --panel: #1c1822; --ink: #e8e0d0; --accent: #ffd27a; --line: #332c3e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
      #app { display: flex; flex-direction: column; height: 100vh; }
      #toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
      #toolbar .tool-group { display: flex; flex-wrap: wrap; gap: 4px; }
      #main { flex: 1; display: flex; min-height: 0; }
      #stage { flex: 1; position: relative; min-width: 0; }
      #stage-canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
      #sidebar { width: 320px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px; }
      #status { padding: 4px 10px; background: #0e0b12; border-top: 1px solid var(--line); font-family: monospace; font-size: 12px; color: #b9b0c4; }
      button.tool, button.action { background: #2a2533; color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; cursor: pointer; font-size: 12px; }
      button.tool:hover, button.action:hover { background: #36303f; }
      button.tool.active { background: var(--accent); color: #201a10; border-color: var(--accent); font-weight: 600; }
      button.action.danger { background: #4a2230; border-color: #6a2e40; }
      .map-select, select, input, textarea { background: #120f17; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px; font: inherit; width: 100%; }
      textarea.bad { border-color: #c0405a; }
      label.field { display: block; margin: 6px 0; }
      label.field .lbl { display: block; font-size: 11px; color: #a99fbb; margin-bottom: 2px; }
      label.check { display: block; margin: 3px 0; cursor: pointer; }
      .section { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 10px; }
      .section h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
      .props .tag { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
      .muted { color: #8a8197; font-size: 12px; }
      .help { color: #8a8197; font-size: 11px; line-height: 1.5; }
      #toolbar > label.field { display: inline-flex; align-items: center; gap: 6px; margin: 0; }
      #toolbar > label.field .lbl { margin: 0; }
      #toolbar .map-select { width: auto; }
    </style>
    <script type="module" crossorigin src="./assets/editor-C70mTVGK.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="main">
        <div id="stage"><canvas id="stage-canvas"></canvas></div>
        <div id="sidebar"></div>
      </div>
      <div id="status">Loading…</div>
    </div>
  </body>
</html>
